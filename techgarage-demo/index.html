<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechGarage</title>
<meta name="description" content="Design demo for techgarage.tn — PC games, gift cards, mobile top-ups and software, delivered digitally in Tunisia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css?v=20261124t">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2338a699'/%3E%3Cpath d='M9 11h14M16 11v12' stroke='%23062' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<button class="skip-link" type="button" data-i18n="skip">Skip to content</button>

<div class="room" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="stage">
  <div class="browser">

    <!-- ── the app ────────────────────────────────────────────────── -->
    <div class="app" id="app">

      <!-- icon rail -->
      <nav class="rail" aria-label="Sections" data-i18n-attr="aria-label:rail.sections">
        <p class="rail-title" data-i18n="rail.menu">Menu</p>
        <button class="rail-btn" data-rail="home" data-go="#/" aria-current="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span class="rail-label" data-i18n="rail.store">Store</span>
          <span class="tip" data-i18n="rail.store">Store</span>
        </button>
        <button class="rail-btn" data-rail="wishlist" data-go="#/wishlist">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="rail-label" data-i18n="rail.wishlist">Wishlist</span>
          <span class="rail-count" id="wishCount">0</span>
          <span class="tip" data-i18n="rail.wishlist">Wishlist</span>
        </button>
        <button class="rail-btn" data-rail="cart" id="railCart">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="rail-label" data-i18n="rail.basket">Basket</span>
          <span class="rail-count" id="cartCount">0</span>
          <span class="tip" data-i18n="rail.basket">Basket</span>
        </button>
        <button class="rail-btn rail-extra" data-rail="orders" data-go="#/orders">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          <span class="rail-label" data-i18n="rail.orders">Orders</span>
          <span class="tip" data-i18n="rail.orders">Orders</span>
        </button>
        <button class="rail-btn" data-rail="account" data-go="#/profile">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="rail-label" data-i18n="rail.profile">Profile</span>
          <span class="tip" data-i18n="rail.profile">Profile</span>
        </button>
        <span class="rail-sep rail-extra" aria-hidden="true"></span>
        <button class="rail-btn rail-extra" data-rail="admin" data-go="#/admin">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span class="rail-label" data-i18n="rail.admin">Store admin</span>
          <span class="tip" data-i18n="rail.admin">Store admin</span>
        </button>
        <button class="rail-btn" data-rail="settings" data-go="#/settings">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span class="rail-label" data-i18n="rail.settings">Settings</span>
          <span class="tip" data-i18n="rail.settings">Settings</span>
        </button>
        <button class="rail-toggle" id="railToggle" type="button" aria-pressed="false" aria-label="Collapse menu" data-i18n-attr="aria-label:rail.collapse"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg><span class="rail-label" data-i18n="rail.collapse">Collapse menu</span></button>
      </nav>

      <!-- top bar -->
      <header class="topbar">
        <div class="search" id="searchWrap">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.4-3.4"/></svg>
          <input id="search" type="search" placeholder="Search the store" autocomplete="off" aria-label="Search products" data-i18n-attr="placeholder:search.ph,aria-label:search.label" aria-expanded="false" aria-controls="results">
          <kbd>/</kbd>
          <div class="results" id="results" role="listbox" aria-label="Search results" data-i18n-attr="aria-label:search.results"></div>
        </div>

        <nav class="tabs" id="tabs" role="tablist" aria-label="Categories" data-i18n-attr="aria-label:tabs.label">
          <span class="tab-pill" id="tabPill" aria-hidden="true"></span>
        </nav>
        <div class="mega" id="mega" role="menu" hidden></div>

        <div class="topbar-right">
          <button class="icon-btn lang-btn" id="langBtn" aria-label="Language" aria-expanded="false" data-i18n-attr="aria-label:lang.label">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
            <span class="lang-code" id="langCode">EN</span>
          </button>
          <button class="icon-btn" id="bell" aria-label="Notifications" aria-expanded="false" data-i18n-attr="aria-label:bell">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.2 7.5-2.2 7.5h16.4S18 14.5 18 8.5"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></svg>
            <span class="dot" id="bellDot" hidden></span>
          </button>

          <button class="account" id="accountBtn" aria-expanded="false">
            <img id="accountAvatar" src="" alt="">
            <span class="who"><b id="accountName"></b><span id="accountHandle"></span></span>
            <svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>

          <div class="pop" id="bellPop"></div>
          <div class="pop" id="accountPop" style="width:270px"></div>
          <div class="pop" id="langPop" role="menu" style="width:210px"></div>
        </div>
      </header>

      <!-- main -->
      <main class="view" id="view" tabindex="-1"></main>

      <!-- overlays -->
      <div class="scrim" id="scrim"></div>

      <aside class="drawer" id="drawer" aria-label="Basket" aria-hidden="true" data-i18n-attr="aria-label:rail.basket">
        <div class="drawer-head">
          <h2 data-i18n="basket.title">Your basket</h2>
          <button class="close" id="closeCart" aria-label="Close basket" data-i18n-attr="aria-label:basket.close">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="lines" id="lines"></div>
        <div class="drawer-foot">
          <div class="total"><span data-i18n="basket.total">Total</span><b id="total">0 DT</b></div>
          <button class="btn btn-solid" id="checkout" data-i18n="basket.checkout">Checkout</button>
        </div>
      </aside>

      <div class="toasts" id="toasts" aria-live="polite"></div>

    </div><!-- /app -->
  </div><!-- /browser -->
</div><!-- /stage -->

<script type="module" src="assets/js/app.js?v=20261124t"></script>
</body>
</html>
