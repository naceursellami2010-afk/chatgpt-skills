<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechGarage — Gaming Store</title>
<meta name="description" content="Design demo for techgarage.tn — gaming PCs, components, peripherals and game keys, delivered in Tunisia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2338a699'/%3E%3Cpath d='M9 11h14M16 11v12' stroke='%23062' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>

<div class="room" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="stage">
  <div class="browser">

    <!-- ── the app ────────────────────────────────────────────────── -->
    <div class="app" id="app">

      <!-- icon rail -->
      <nav class="rail" aria-label="Sections">
        <button class="rail-btn" aria-current="true" data-rail="home">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.2L12 3l9 7.2V20a1.6 1.6 0 0 1-1.6 1.6H4.6A1.6 1.6 0 0 1 3 20z"/></svg>
          <span class="tip">Store</span>
        </button>
        <button class="rail-btn" data-rail="wishlist">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.3 5.6a5 5 0 0 0-7.1 0L12 6.8l-1.2-1.2a5 5 0 1 0-7.1 7.1l8.3 8.3 8.3-8.3a5 5 0 0 0 0-7.1z"/></svg>
          <span class="tip">Wishlist</span>
          <span class="rail-count" id="wishCount">0</span>
        </button>
        <button class="rail-btn" data-rail="cart" id="railCart">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.1 11.2a1.8 1.8 0 0 0 1.8 1.5h8.3a1.8 1.8 0 0 0 1.8-1.4L21 8H6.2"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg>
          <span class="tip">Basket</span>
          <span class="rail-count" id="cartCount">0</span>
        </button>
        <button class="rail-btn" data-rail="account">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>
          <span class="tip">Account</span>
        </button>
        <button class="rail-btn" data-rail="support">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-3-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-3l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg>
          <span class="tip">Support</span>
        </button>
      </nav>

      <!-- top bar -->
      <header class="topbar">
        <div class="search" id="searchWrap">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.4-3.4"/></svg>
          <input id="search" type="search" placeholder="Search the store" autocomplete="off" aria-label="Search products" aria-expanded="false" aria-controls="results">
          <kbd>/</kbd>
          <div class="results" id="results" role="listbox" aria-label="Search results"></div>
        </div>

        <nav class="tabs" id="tabs" role="tablist" aria-label="Categories">
          <span class="tab-pill" id="tabPill" aria-hidden="true"></span>
        </nav>

        <div class="topbar-right">
          <button class="icon-btn" id="bell" aria-label="Notifications" aria-expanded="false">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.2 7.5-2.2 7.5h16.4S18 14.5 18 8.5"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></svg>
            <span class="dot" id="bellDot"></span>
          </button>

          <button class="account" id="accountBtn" aria-expanded="false">
            <img id="accountAvatar" src="" alt="">
            <span class="who"><b id="accountName"></b><span id="accountHandle"></span></span>
            <svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>

          <div class="pop" id="bellPop"></div>
          <div class="pop" id="accountPop" style="width:250px"></div>
        </div>
      </header>

      <!-- main -->
      <main class="main">
        <div class="col-left">

          <section class="card" style="display:flex;flex-direction:column;min-height:0">
            <div class="card-head">
              <span class="flame">🔥</span>
              <h2>New Drops</h2>
              <div class="sort">
                <button class="sort-btn" id="sortBtn" aria-expanded="false">
                  Sort by: <b id="sortLabel">Newest</b>
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-4 4m0 0l4 4M4 11h8M16 17l4-4m0 0l-4-4m4 4h-8"/></svg>
                </button>
                <div class="pop" id="sortPop" role="menu"></div>
              </div>
            </div>
            <div class="drops" id="drops"></div>
          </section>

          <section class="card">
            <div class="card-head"><h2>Recently Viewed</h2></div>
            <div class="recent" id="recent"></div>
          </section>

        </div>

        <div class="col-right">

          <section class="hero" id="hero" aria-roledescription="carousel" aria-label="Featured products">
            <span class="badge">🔥 Now Trending</span>
            <div class="hero-ticks" id="ticks"></div>
            <div class="hero-nav">
              <button id="prev" aria-label="Previous">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
              </button>
              <button id="next" aria-label="Next">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
              </button>
            </div>
          </section>

          <section>
            <div class="shelf-head">
              <h2 id="shelfTitle">You might like</h2>
              <button class="see-all" id="seeAll">See all</button>
            </div>
            <div class="shelf" id="shelf"></div>
          </section>

        </div>
      </main>

      <!-- overlays -->
      <div class="scrim" id="scrim"></div>

      <aside class="drawer" id="drawer" aria-label="Basket" aria-hidden="true">
        <div class="drawer-head">
          <h2>Your basket</h2>
          <button class="close" id="closeCart" aria-label="Close basket">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="lines" id="lines"></div>
        <div class="drawer-foot">
          <div class="total"><span>Total</span><b id="total">TND0.000</b></div>
          <button class="btn btn-solid" id="checkout">Checkout</button>
        </div>
      </aside>

      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true"></div>

      <div class="toasts" id="toasts" aria-live="polite"></div>

    </div><!-- /app -->
  </div><!-- /browser -->
</div><!-- /stage -->

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
